name: Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The ports typecheck against core's built types, so the packages come first.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:all
      - run: pnpm --filter @stacknav/angular-demo exec playwright-core install --with-deps chromium
      - run: pnpm --filter @stacknav/angular-demo e2e
      - run: pnpm --filter @stacknav/react-demo e2e
